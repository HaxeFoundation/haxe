# Builds the opam root (OCaml + the compiler's opam dependencies) that extra/agent-setup.sh
# downloads, and publishes it as an asset of the `agent-ocaml-deps` prerelease.
# Coding agents in fresh containers can then build Haxe in a couple of minutes instead of
# compiling OCaml and every dependency from source.

name: Agent OCaml deps

on:
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild even if an asset for the current cache key already exists
        type: boolean
        default: false
  push:
    branches: [development]
    paths:
      - haxe.opam
      - extra/agent-setup.sh
      - .github/workflows/agent-ocaml-deps.yml

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  RELEASE_TAG: agent-ocaml-deps

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    # Build inside the same base image the agent containers use, at the fixed /opt/opam path.
    container: ubuntu:24.04
    steps:
      - name: Install bootstrap packages
        run: |
          apt-get update -qq
          apt-get install -qqy --no-install-recommends git ca-certificates curl

      - uses: actions/checkout@v4

      - name: Compute asset name
        id: key
        run: echo "asset=$(extra/agent-setup.sh --print-key)" >> "$GITHUB_OUTPUT"

      - name: Check for an existing asset
        id: existing
        if: ${{ !inputs.force }}
        run: |
          if curl -fsSIL -o /dev/null "https://github.com/${{ github.repository }}/releases/download/$RELEASE_TAG/${{ steps.key.outputs.asset }}"; then
            echo "Asset already published, nothing to do"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build the opam root and the compiler
        if: steps.existing.outputs.exists != 'true'
        run: extra/agent-setup.sh --from-source --no-profile

      - name: Package
        if: steps.existing.outputs.exists != 'true'
        run: |
          tar -C /opt --zstd -cf "${{ steps.key.outputs.asset }}" opam
          ls -l "${{ steps.key.outputs.asset }}"

      - uses: actions/upload-artifact@v4
        if: steps.existing.outputs.exists != 'true'
        with:
          name: ${{ steps.key.outputs.asset }}
          path: ${{ steps.key.outputs.asset }}
          retention-days: 1
          compression-level: 0

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true

      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          shopt -s nullglob
          files=(assets/*.tar.zst)
          if [ ${#files[@]} = 0 ]; then
            echo "Nothing new to publish"
            exit 0
          fi
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --prerelease --target "$GITHUB_SHA" \
              --title "Prebuilt OCaml dependencies for agents" \
              --notes "Prebuilt opam roots used by extra/agent-setup.sh. Updated automatically by the Agent OCaml deps workflow."
          fi
          gh release upload "$RELEASE_TAG" "${files[@]}" --clobber
