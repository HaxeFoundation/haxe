name: Restore hxcpp compile cache
description: >
  Restores the hxcpp compile cache (HXCPP_COMPILE_CACHE) from earlier runs. hxcpp stores
  objects by a hash of the source, its declared dependencies, the flags and the compiler
  version, so objects of generated files that didn't change since an earlier run are reused.
  Save the cache with actions/cache/save at the end of the job, using the `key` output.
inputs:
  key-prefix:
    description: 'Platform/arch-specific cache key prefix (e.g., hxcpp-linux-x86)'
    required: true
outputs:
  key:
    description: 'The key to save the cache with'
    value: ${{ steps.key.outputs.key }}
runs:
  using: composite
  steps:
    - name: Compute hxcpp cache key
      id: key
      shell: bash
      run: |
        # RunCi installs hxcpp from git later on. Objects depend on the hxcpp headers, so a
        # new hxcpp revision starts a new cache instead of carrying the stale objects along.
        rev=$(git ls-remote https://github.com/HaxeFoundation/hxcpp.git HEAD | cut -f1)
        echo "prefix=${{ inputs.key-prefix }}-$rev-" >> "$GITHUB_OUTPUT"
        echo "key=${{ inputs.key-prefix }}-$rev-${{ github.run_id }}-${{ github.run_attempt }}" >> "$GITHUB_OUTPUT"

    - uses: actions/cache/restore@v6
      with:
        path: ${{ env.HXCPP_COMPILE_CACHE }}
        key: ${{ steps.key.outputs.key }}
        restore-keys: ${{ steps.key.outputs.prefix }}
