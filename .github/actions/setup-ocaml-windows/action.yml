name: Setup Ocaml Windows
runs:
  using: composite
  steps:
  - name: Setup ocaml
    uses: ocaml/setup-ocaml@v3
    with:
      ocaml-compiler: ${{ env.OCAML_VERSION }}
      opam-local-packages: |
        haxe.opam
      dune-cache: true

  # Cache the opam switch including all compiled haxe dependencies.
  # This cache is placed after setup-ocaml so that on a cache hit it
  # overwrites the switch directory (which setup-ocaml populates without
  # haxe deps) with one that already contains all compiled packages.
  # The post-step of actions/cache saves the switch at job end, which is
  # after Install OCaml libraries has run, so the saved cache includes
  # the fully-built haxe dependencies.
  - name: Cache opam switch
    id: cache-opam
    uses: actions/cache@v4
    with:
      path: _opam
      key: ${{ runner.os }}-${{ env.MINGW_ARCH }}-${{ env.OCAML_VERSION }}-${{ hashFiles('./haxe.opam', './libs/') }}-1

  - name: Install dependencies
    shell: pwsh
    env:
      MBEDTLS_VERSION: 3.6.5
    run: |
      curl.exe -fsSL -o "libmbedtls.tar.xz" --retry 3 `
        https://github.com/Simn/mingw64-mbedtls/releases/download/${{ env.MBEDTLS_VERSION }}/mingw64-${{ env.MINGW_ARCH }}-mbedtls-${{ env.MBEDTLS_VERSION }}-1-noarch.tar.xz
      ${{ env.CYG_ROOT }}\bin\tar.exe -C ${{ env.CYG_ROOT }} -xvf libmbedtls.tar.xz

  - name: Install OCaml libraries
    if: steps.cache-opam.outputs.cache-hit != 'true'
    uses: nick-fields/retry@v3
    with:
      timeout_minutes: 10
      max_attempts: 10
      retry_on: timeout
      shell: pwsh
      command: |
        Set-PSDebug -Trace 1
        # stop after any command returns an error
        $PSNativeCommandUseErrorActionPreference = $true
        $ErrorActionPreference = 'Stop'
        # see: https://github.com/aantron/luv/issues/162
        $env:PATH="${env:CYG_ROOT}\bin;${env:CYG_ROOT}\usr\x86_64-w64-mingw32\bin;${env:PATH}"
        opam install haxe --deps-only
        opam list
    env:
      # Work around default resolver installing 32-bit libraries
      OPAMEXTERNALSOLVER: builtin-mccs+glpk
